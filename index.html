<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こもれびの冒険</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#172e30;color:#f7efcf;
  font-family:system-ui,sans-serif;
}
main{max-width:760px;margin:auto;padding:16px}
h1{font-size:23px;margin:0 0 6px}
.subtitle{font-size:12px;color:#b9cebb;margin:0 0 12px}
#status{
  padding:12px;background:#294649;border-radius:10px;
  font-size:13px;line-height:1.8;margin-bottom:10px;
}
.stage{position:relative}
canvas{
  display:block;width:100%;height:auto;background:#91bc73;
  border:4px solid #e6d5a3;border-radius:8px;
  image-rendering:pixelated;touch-action:none;
}
#message{
  background:#f4e8c5;color:#30423b;padding:14px;
  border-radius:9px;margin-top:10px;min-height:78px;
  line-height:1.7;font-size:14px;
}
.controls{
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;margin-top:14px;
}
.pad{display:grid;grid-template-columns:repeat(3,52px);gap:5px}
button{
  font:inherit;color:#f7efcf;background:#3d6460;
  border:2px solid #85a493;border-radius:10px;
  padding:12px;cursor:pointer;touch-action:manipulation;
}
button:active{background:#668d73}
button:disabled{opacity:.45;cursor:default}
.pad button{height:48px;padding:0;touch-action:none;user-select:none}
#action{min-height:64px;min-width:110px;background:#80664a}
footer{font-size:11px;color:#b8cbb8;margin-top:14px}
.overlay{
  position:fixed;inset:0;background:#112929df;
  display:grid;place-items:center;padding:16px;z-index:10;
}
[hidden]{display:none!important}
.card{
  width:min(100%,460px);max-height:90vh;overflow:auto;
  background:#f4e8c5;color:#30423b;
  padding:20px;border:4px solid #bfa776;border-radius:16px;
  box-shadow:0 20px 60px #0007;
}
.card h2{margin:0 0 14px;font-size:21px}
.choices{display:grid;gap:10px}
.choices button{text-align:left}
.monster{
  text-align:center;font-size:58px;background:#d5dcaf;
  border-radius:12px;padding:12px;margin:12px 0;
}
.hp{height:12px;background:#c8c4aa;border-radius:6px;overflow:hidden;margin:6px 0 14px}
.hp i{display:block;height:100%;background:#629e68;transition:width .2s}
#log{min-height:64px;white-space:pre-line;font-size:14px;line-height:1.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#closeBattle{width:100%;margin-top:10px}
#battleNote{font-size:12px}
</style>
</head>
<body>
<main>
  <h1>🌿 こもれびの冒険</h1>
  <p class="subtitle">小さな村から、相棒との旅へ。</p>
  <div id="status">冒険の準備中……</div>
  <div class="stage">
    <canvas id="game" width="640" height="448"
      tabindex="0" aria-label="村のマップ"></canvas>
  </div>
  <div id="message" aria-live="polite"></div>
  <div class="controls">
    <div class="pad">
      <span></span><button data-dir="up" aria-label="上">▲</button><span></span>
      <button data-dir="left" aria-label="左">◀</button>
      <button data-dir="down" aria-label="下">▼</button>
      <button data-dir="right" aria-label="右">▶</button>
    </div>
    <button id="action">調べる</button>
  </div>
  <footer>移動：矢印 / WASD ｜ 調べる：Z / Enter ｜ セーブ未対応</footer>
</main>

<div id="lab" class="overlay" hidden>
  <section class="card" role="dialog" aria-modal="true" aria-labelledby="labTitle">
    <h2 id="labTitle">最初の相棒を選ぼう</h2>
    <p>コモレビ博士「いっしょに冒険する仲間を選んでね！」</p>
    <div class="choices">
      <button data-starter="0">🌱 コノハル — バランスのよい草の子</button>
      <button data-starter="1">🔥 ヒノポン — 攻撃が得意な炎の子</button>
      <button data-starter="2">💧 ミズマル — HPが高い水の子</button>
      <button id="leaveLab">あとで選ぶ</button>
    </div>
  </section>
</div>

<div id="battle" class="overlay" hidden>
  <section class="card" role="dialog" aria-modal="true" aria-labelledby="battleTitle">
    <h2 id="battleTitle">野生のモンスター！</h2>
    <div id="enemyInfo"></div>
    <div class="hp"><i id="enemyBar"></i></div>
    <div id="enemySprite" class="monster"></div>
    <div id="allyInfo"></div>
    <div class="hp"><i id="allyBar"></i></div>
    <p id="log" aria-live="polite"></p>
    <p id="battleNote"></p>
    <div class="actions">
      <button id="attack">たたかう</button>
      <button id="catch">捕まえる</button>
      <button id="run">逃げる</button>
    </div>
    <button id="closeBattle" hidden>探索に戻る</button>
  </section>
</div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const T=32, W=20, H=14;
const p={x:7,y:10,px:224,py:320,dir:"down",moving:false};
const directions={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const keyMap={
  ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
  w:"up",s:"down",a:"left",d:"right"
};
const starters=[
  {name:"コノハル",icon:"🌱",maxHp:30,atk:10,def:6},
  {name:"ヒノポン",icon:"🔥",maxHp:26,atk:12,def:5},
  {name:"ミズマル",icon:"💧",maxHp:35,atk:9,def:7}
];
const wildTypes=[
  {name:"モコリ",icon:"🐾",maxHp:20,atk:7,def:4},
  {name:"ハネピ",icon:"🐥",maxHp:18,atk:8,def:3},
  {name:"クサモチ",icon:"🌿",maxHp:23,atk:6,def:5}
];
let partner=null, party=[], balls=5, enemy=null;
let mode="map", pressed=[], touch="", busy=false, ended=false;
let safe=0, grassCount=0, clock=0, last=0;

function say(text){$("message").textContent=text}
function clearInput(){pressed=[];touch=""}
function status(){
  $("status").textContent=partner
    ? partner.icon+" "+partner.name+" Lv."+partner.level+
      " ｜ HP "+partner.hp+"/"+partner.maxHp+
      " ｜ EXP "+partner.exp+"/"+partner.level*8+
      " ｜ ボール "+balls+"個 ｜ 仲間 "+party.length+"/6"
    : "相棒：まだいません ｜ 左上の研究所へ行こう";
}
function tile(x,y){
  if(x<=0||y<=0||x>=W-1||y>=H-1)return "tree";
  if(x>=2&&x<=5&&y>=2&&y<=4)return "house";
  if(x>=15&&x<=18&&y>=8&&y<=11)return "water";
  if(x>=13&&x<=17&&y>=2&&y<=5)return "grass";
  if(x===7||y===7||(x===4&&y>=5&&y<=7)||
     (y===10&&x>=4&&x<=12))return "path";
  return "ground";
}
function blocked(x,y){
  return ["tree","house","water"].includes(tile(x,y))||
    (x===10&&y===6)||(x===7&&y===5);
}
function heal(){
  party.forEach(m=>m.hp=m.maxHp);
  balls=5;status();
}
function openLab(){
  clearInput();
  if(partner){
    heal();
    say("博士：みんなのHPを全回復！ ボールも5個に補充したよ。");
  }else{
    mode="lab";$("lab").hidden=false;
    document.querySelector("[data-starter]").focus();
  }
}
function closeLab(){
  $("lab").hidden=true;mode="map";clearInput();
  canvas.focus({preventScroll:true});
}
function interact(){
  if(mode!=="map"||p.moving)return;
  if(p.x===4&&p.y===5){openLab();return}
  if(Math.abs(p.x-10)+Math.abs(p.y-6)===1){
    say("ミナ：右上の濃い草むらでモンスターに会えるよ！ HPが減ったら研究所へ。");
    return;
  }
  const [dx,dy]=directions[p.dir];
  const x=p.x+dx,y=p.y+dy;
  if(x===7&&y===5){
    say("案内板：左上＝研究所 ／ 右上＝草むら。研究所の矢印の上で「調べる」！");
  }else if(tile(x,y)==="house"){
    say("研究所の入り口は建物の下側。矢印のマスで「調べる」を押そう。");
  }else{
    say(partner
      ? "相棒と歩く村。右上の草むらで野生のモンスターを探そう！"
      : "まずは左上の研究所へ。扉のすぐ下の矢印が目印だよ。");
  }
}
document.querySelectorAll("[data-starter]").forEach(button=>{
  button.onclick=()=>{
    if(partner)return;
    const s=starters[Number(button.dataset.starter)];
    partner={...s,hp:s.maxHp,level:5,exp:0};
    party.push(partner);safe=3;status();closeLab();
    say("博士："+partner.name+"が仲間になった！ ボールは5個。右上の草むらへ行ってみよう！");
  };
});
$("leaveLab").onclick=closeLab;
$("action").onclick=interact;

function chance(){return .25+(1-enemy.hp/enemy.maxHp)*.65}
function syncBattle(){
  $("enemyInfo").textContent=enemy.name+" Lv."+enemy.level+
    " ｜ HP "+enemy.hp+"/"+enemy.maxHp;
  $("allyInfo").textContent=partner.icon+" "+partner.name+
    " Lv."+partner.level+" ｜ HP "+partner.hp+"/"+partner.maxHp;
  $("enemyBar").style.width=(100*enemy.hp/enemy.maxHp)+"%";
  $("allyBar").style.width=(100*partner.hp/partner.maxHp)+"%";
  $("attack").disabled=busy||ended;
  $("catch").disabled=busy||ended||balls===0||party.length>=6;
  $("run").disabled=busy||ended;
  $("catch").textContent="捕まえる（"+balls+"個）";
  $("closeBattle").hidden=!ended;
  $("battleNote").textContent=ended ? "探索に戻って冒険を続けよう。"
    :party.length>=6 ? "仲間がいっぱいです。最大6匹まで。"
    :balls===0 ? "ボールがありません。研究所で補充できます。"
    :"捕獲成功率：約"+Math.round(chance()*100)+"%。HPを減らすと捕まえやすい！";
  status();
}
function log(text){$("log").textContent=text}
function append(text){$("log").textContent+="\n"+text}
function encounter(){
  const s=wildTypes[Math.floor(Math.random()*wildTypes.length)];
  const level=2+Math.floor(Math.random()*3);
  enemy={...s,level,maxHp:s.maxHp+level,hp:s.maxHp+level,exp:0};
  mode="battle";busy=false;ended=false;grassCount=0;clearInput();
  $("battleTitle").textContent="野生の"+enemy.name+"が現れた！";
  $("enemySprite").textContent=enemy.icon;
  log("いっておいで、"+partner.name+"！");
  syncBattle();$("battle").hidden=false;$("attack").focus();
}
// 通常攻撃の計算は維持し、技と防御の補正だけ追加
let movePower = 1;
let guarding = false;

function damage(a, b) {
  const base = Math.max(
    2,
    Math.floor(a.atk + a.level * .5 - b.def * .6 + Math.random() * 4)
  );

  if (a === partner) {
    return Math.max(2, Math.floor(base * movePower));
  }

  if (a === enemy && guarding) {
    guarding = false;
    return Math.max(1, Math.floor(base * .35));
  }

  return base;
}

function finish(text){
  append(text);busy=false;ended=true;syncBattle();
  $("closeBattle").focus();
}
function enemyTurn(){
  setTimeout(()=>{
    const amount=Math.min(partner.hp,damage(enemy,partner));
    partner.hp-=amount;
    append(enemy.name+"の攻撃！ "+amount+"ダメージ。");
    if(partner.hp<=0){
      finish("相棒は力尽きた……。探索に戻ると研究所で回復します。");
    }else{
      busy=false;syncBattle();
    }
  },550);
}
$("attack").onclick=()=>{
  if(mode!=="battle"||busy||ended)return;
  busy=true;
  const amount=Math.min(enemy.hp,damage(partner,enemy));
  enemy.hp-=amount;
  log(partner.name+"の攻撃！ "+amount+"ダメージ。");
  syncBattle();
  if(enemy.hp===0){
    const exp=enemy.level*5+8;
    partner.exp+=exp;
    let text=enemy.name+"を倒した！ 経験値を"+exp+"獲得！";
    while(partner.exp>=partner.level*8){
      partner.exp-=partner.level*8;partner.level++;
      partner.maxHp+=3;partner.hp=Math.min(partner.maxHp,partner.hp+3);
      partner.atk+=2;partner.def++;
      text+="\nレベルアップ！ Lv."+partner.level+"になった！";
    }
    finish(text);
  }else enemyTurn();
};
$("catch").onclick=()=>{
  if(mode!=="battle"||busy||ended||balls<=0||party.length>=6)return;
  busy=true;balls--;log("ボールを投げた……！");syncBattle();
  setTimeout(()=>{
    if(Math.random()<chance()){
      party.push({...enemy,hp:enemy.maxHp});
      finish(enemy.name+"を捕まえた！\n仲間："+party.map(m=>m.name).join("・"));
    }else{
      append("ボールから出てしまった！");enemyTurn();
    }
  },650);
};
$("run").onclick=()=>{
  if(mode!=="battle"||busy||ended)return;
  log("無事に逃げられた！");
  finish("このバージョンでは必ず逃げられます。");
};
$("closeBattle").onclick=()=>{
  if(!ended)return;
  const lost=partner.hp<=0;
  if(lost){
    heal();p.x=4;p.y=5;p.px=128;p.py=160;p.dir="up";p.moving=false;
  }
  $("battle").hidden=true;mode="map";safe=5;clearInput();status();
  say(lost ? "博士：おかえり。全員回復したよ！ ボールも5個に補充した。"
    : "冒険を続けよう！ 回復とボール補充は研究所の扉で「調べる」。");
  canvas.focus({preventScroll:true});
};

function rect(x,y,w,h,color){
  ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h);
}
function tree(x,y){
  rect(x+12,y+18,8,14,"#796047");
  rect(x+2,y+13,28,14,"#326649");
  rect(x+2,y+6,28,16,"#49854c");
  rect(x+7,y+1,19,12,"#6a9e58");
  rect(x+10,y+3,11,3,"#91b971");
}
function drawTile(x,y){
  const a=x*T,b=y*T,t=tile(x,y);
  rect(a,b,T,T,(x+y)%2 ? "#94bf79":"#8bb772");
  rect(a+((x*7+y*11)%24),b+12,3,2,"#78a55e");
  if(t==="path"){
    rect(a,b,T,T,"#dfcc9b");
    rect(a+7,b+8,3,2,"#c4ae7c");
    rect(a+23,b+25,4,2,"#eedcaf");
  }
  if(t==="tree")tree(a,b);
  if(t==="water"){
    rect(a,b,T,T,"#509ba9");
    const offset=Math.sin(clock*2+x+y)*3;
    rect(a+6+offset,b+10,12,2,"#9ed9d4");
    rect(a+17-offset,b+23,8,2,"#79c4c5");
  }
  if(t==="grass"){
    rect(a,b,T,T,"#609751");
    for(let i=0;i<4;i++){
      const gx=a+3+(i%2)*15,gy=b+3+Math.floor(i/2)*15;
      rect(gx+4,gy+4,3,10,"#367547");
      rect(gx,gy+2,3,7,"#a1cb74");
      rect(gx+8,gy,3,9,"#88ba62");
    }
  }
  if(t==="ground"&&(x*13+y*7)%17===0){
    rect(a+16,b+19,2,7,"#598447");
    rect(a+13,b+16,8,4,"#ffe3a3");
    rect(a+15,b+14,4,8,"#fff0bd");
  }
}
function house(){
  rect(66,148,128,15,"#63894f");
  rect(68,95,120,63,"#ecd8aa");
  rect(68,150,120,8,"#b19a73");
  rect(60,85,136,18,"#875044");
  rect(66,73,124,17,"#b86953");
  rect(78,61,100,16,"#cf8663");
  rect(90,55,76,9,"#e6a777");
  for(let i=0;i<6;i++)rect(75+i*19,83,12,2,"#edac81");
  [80,160].forEach(x=>{
    rect(x,112,22,24,"#977d5a");
    rect(x+3,115,16,17,"#83b9bb");
    rect(x+10,115,2,17,"#eee6c8");
    rect(x+3,122,16,2,"#eee6c8");
  });
  rect(132,116,24,42,"#73583f");
  rect(136,120,16,38,"#ac8257");
  rect(148,139,3,3,"#f8e5a0");
  rect(128,158,32,4,"#efe0b6");
  const y=173+Math.sin(clock*3)*2;
  rect(137,y,14,3,"#fff4c5");
  rect(140,y-3,8,3,"#fff4c5");
  rect(143,y-6,2,3,"#fff4c5");
  ctx.fillStyle="#583e32";ctx.font="bold 10px sans-serif";
  ctx.textAlign="center";ctx.fillText("LAB",112,111);
}
function person(x,y,hero,dir,moving){
  x=Math.round(x);
  const base=y;
  y=Math.round(y-(moving?Math.abs(Math.sin(clock*18))*2:0));
  ctx.fillStyle="#284a3d44";ctx.beginPath();
  ctx.ellipse(x+16,base+29,11,4,0,0,Math.PI*2);ctx.fill();
  rect(x+9,y+24,6,7,"#374753");
  rect(x+18,y+24,6,7,"#374753");
  rect(x+8,y+15,17,11,hero?"#d1785b":"#578dab");
  rect(x+5,y+18,4,7,"#edc99a");
  rect(x+25,y+18,3,7,"#edc99a");
  rect(x+9,y+5,16,12,"#f5d4a2");
  rect(x+8,y+2,18,6,"#69513e");
  if(hero){
    rect(x+7,y,20,6,"#f6e1ac");
    rect(x+5,y+5,24,4,"#c7a369");
  }else{
    rect(x+6,y+6,4,11,"#69513e");
    rect(x+24,y+6,4,11,"#69513e");
  }
  if(dir==="up"){
    rect(x+10,y+9,14,7,"#69513e");
    if(hero)rect(x+11,y+18,11,9,"#c2bc7b");
  }else{
    if(dir!=="right")rect(x+12,y+11,2,3,"#334437");
    if(dir!=="left")rect(x+21,y+11,2,3,"#334437");
  }
}
function draw(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(x,y);
  const objects=[
    {depth:162,paint:house},
    {depth:190,paint:()=>{
      rect(238,178,5,14,"#876b47");
      rect(227,163,27,18,"#876b47");
      rect(229,165,23,13,"#ead7aa");
      rect(233,169,15,2,"#98805c");
      rect(233,173,10,2,"#98805c");
    }},
    {depth:222,paint:()=>person(320,192,false,"down",false)},
    {depth:p.py+30,paint:()=>person(p.px,p.py,true,p.dir,p.moving)}
  ];
  objects.sort((a,b)=>a.depth-b.depth).forEach(o=>o.paint());
}
function update(dt){
  clock+=dt;
  if(mode!=="map")return;
  if(p.moving){
    const dx=p.x*T-p.px,dy=p.y*T-p.py;
    const distance=Math.hypot(dx,dy),step=180*dt;
    if(distance<=step){
      p.px=p.x*T;p.py=p.y*T;p.moving=false;
      if(partner){
        if(safe>0)safe--;
        else if(tile(p.x,p.y)==="grass"){
          grassCount++;
          if(Math.random()<.18||grassCount>=7)encounter();
        }
      }
    }else{
      p.px+=dx/distance*step;p.py+=dy/distance*step;
    }
  }
  if(mode!=="map"||p.moving)return;
  const dir=touch||pressed[pressed.length-1];
  if(!dir)return;
  p.dir=dir;
  const [dx,dy]=directions[dir],x=p.x+dx,y=p.y+dy;
  if(!blocked(x,y)){p.x=x;p.y=y;p.moving=true}
}
function normalize(e){return e.key.length===1?e.key.toLowerCase():e.key}
window.addEventListener("keydown",e=>{
  if(mode!=="map")return;
  if(e.target.matches("input,textarea,select")||e.target.isContentEditable)return;
  const key=normalize(e),dir=keyMap[key];
  if(dir){
    e.preventDefault();
    if(!pressed.includes(dir))pressed.push(dir);
  }
  if(key==="z"||key==="Enter"||key===" "){
    if(e.target.closest("button")&&key!=="z")return;
    e.preventDefault();if(!e.repeat)interact();
  }
});
window.addEventListener("keyup",e=>{
  const dir=keyMap[normalize(e)];
  pressed=pressed.filter(d=>d!==dir);
});
window.addEventListener("blur",clearInput);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)clearInput();
});
document.querySelectorAll("[data-dir]").forEach(button=>{
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();if(mode!=="map")return;
    button.setPointerCapture(e.pointerId);touch=button.dataset.dir;
  });
  const release=()=>{if(touch===button.dataset.dir)touch=""};
  button.addEventListener("pointerup",release);
  button.addEventListener("pointercancel",release);
  button.addEventListener("lostpointercapture",release);

// 元の攻撃処理を保持。
// ダメージ・勝利・経験値・レベルアップの処理を使い続ける。
const originalAttack = $("attack").onclick;
let selectingMove = false;

function closeMovePanel() {
  selectingMove = false;
  movePanel.hidden = true;
  moveHelp.hidden = true;
  $("attack").textContent = "たたかう";
}

function refreshMovePanel() {
  if (mode !== "battle" || busy || ended) {
    closeMovePanel();
  }

  const locked = mode !== "battle" || busy || ended;

  Object.values(moveButtons).forEach(button => {
    button.disabled = locked;
  });

  moveButtons.rest.disabled =
    locked || !partner || partner.hp >= partner.maxHp;

  moveButtons.special.textContent = partner
    ? (moveNames[partner.name] || "全力アタック")
    : "属性技";

  cancelMove.disabled = locked;
}

$("attack").onclick = () => {
  if (mode !== "battle" || busy || ended) return;

  if (selectingMove) {
    closeMovePanel();
    return;
  }

  selectingMove = true;
  movePanel.hidden = false;
  moveHelp.hidden = false;
  $("attack").textContent = "技を閉じる";
  refreshMovePanel();
  moveButtons.normal.focus({ preventScroll: true });
};

cancelMove.onclick = () => {
  closeMovePanel();
  $("attack").focus({ preventScroll: true });
};

function useMove(kind) {
  if (mode !== "battle" || busy || ended || !partner) return;
  if (kind === "rest" && partner.hp >= partner.maxHp) return;

  closeMovePanel();
  guarding = false;
  movePower = 1;

  if (kind === "rest") {
    busy = true;

    const recovery = Math.min(
      partner.maxHp - partner.hp,
      Math.max(1, Math.floor(partner.maxHp * .3))
    );

    partner.hp += recovery;
    log(
      partner.name + "はひと休み！\nHPが" +
      recovery + "回復した。"
    );
    syncBattle();
    enemyTurn();
    return;
  }

  if (kind === "guard") {
    busy = true;
    guarding = true;
    log(partner.name + "は身を守った！\n次の攻撃に備えている。");
    syncBattle();
    enemyTurn();
    return;
  }

  const name = kind === "special"
    ? (moveNames[partner.name] || "全力アタック")
    : "たいあたり";

  if (kind === "special" && Math.random() >= .85) {
    busy = true;
    log(partner.name + "の" + name + "！\n攻撃は外れた！");
    syncBattle();
    enemyTurn();
    return;
  }

  movePower = kind === "special" ? 1.35 : 1;

  try {
    originalAttack();

    // 元のログの攻撃名だけ変更する。
    // 勝利・経験値・レベルアップの文章は残す。
    $("log").textContent = $("log").textContent.replace(
      partner.name + "の攻撃！",
      partner.name + "の" + name + "！"
    );
  } finally {
    movePower = 1;
  }
}

Object.entries(moveButtons).forEach(([kind, button]) => {
  button.onclick = () => useMove(kind);
});

// 捕獲や逃走を選んだときも技選択を閉じる。
// 既存の処理はそのまま実行する。
["catch", "run", "closeBattle"].forEach(id => {
  const button = $(id);
  const original = button.onclick;

  button.onclick = function(event) {
    if (busy || (id !== "closeBattle" && ended)) return;

    closeMovePanel();
    guarding = false;
    movePower = 1;
    return original.call(this, event);
  };
});

function validInteger(value, min, max) {
  return Number.isSafeInteger(value) &&
    value >= min && value <= max;
}

/* 読み込み前に内容を確認する */
function validateSave(data) {
  if (!data || data.version !== 1) {
    throw new Error("保存形式が違います");
  }

  if (!validInteger(data.savedAt, 0, 8640000000000000)) {
    throw new Error("保存日時が不正です");
  }

  const point = data.player;

  if (
    !point ||
    !validInteger(point.x, 1, W - 2) ||
    !validInteger(point.y, 1, H - 2) ||
    !Object.prototype.hasOwnProperty.call(directions, point.dir) ||
    blocked(point.x, point.y)
  ) {
    throw new Error("プレイヤーの位置が不正です");
  }

  if (
    !Array.isArray(data.party) ||
    data.party.length > 6 ||
    !validInteger(data.balls, 0, 5)
  ) {
    throw new Error("仲間かボール数が不正です");
  }

  const types = [...starters, ...wildTypes];

  const restoredParty = data.party.map(mon => {
    if (!mon || typeof mon !== "object") {
      throw new Error("仲間のデータが不正です");
    }

    const species = types.find(type => type.name === mon.name);

    if (
      !species ||
      !validInteger(mon.level, 1, 1000000) ||
      !validInteger(mon.maxHp, 1, 10000000) ||
      !validInteger(mon.hp, 0, mon.maxHp) ||
      !validInteger(mon.atk, 1, 10000000) ||
      !validInteger(mon.def, 0, 10000000) ||
      !validInteger(mon.exp, 0, mon.level * 8 - 1)
    ) {
      throw new Error("仲間の能力値が不正です");
    }

    return {
      name: species.name,
      icon: species.icon,
      level: mon.level,
      maxHp: mon.maxHp,
      hp: mon.hp,
      atk: mon.atk,
      def: mon.def,
      exp: mon.exp
    };
  });

  if (restoredParty.length === 0) {
    if (data.partnerIndex !== -1) {
      throw new Error("相棒のデータが不正です");
    }
  } else {
    if (
      !validInteger(data.partnerIndex, 0, restoredParty.length - 1) ||
      restoredParty[data.partnerIndex].hp <= 0
    ) {
      throw new Error("相棒のデータが不正です");
    }
  }

  return restoredParty;
}

function restoreAdventure() {
  let raw;

  try {
    raw = localStorage.getItem(SAVE_KEY);
  } catch (error) {
    saveLabel.textContent = "ブラウザの保存領域を利用できません";
    return "保存領域を読み込めませんでした。今回は最初から始めます。";
  }

  if (raw === null) {
    return "ようこそ！ 左上の研究所へ行こう。" +
      "扉の下の白い矢印で「調べる」を押すと、相棒を選べるよ。";
  }

  try {
    const data = JSON.parse(raw);
    const restoredParty = validateSave(data);

    // 検証が終わってからゲームの状態に反映
    party = restoredParty;
    partner = data.partnerIndex === -1
      ? null
      : party[data.partnerIndex];
    balls = data.balls;

    p.x = data.player.x;
    p.y = data.player.y;
    p.px = p.x * T;
    p.py = p.y * T;
    p.dir = data.player.dir;
    p.moving = false;

    mode = "map";
    enemy = null;
    busy = false;
    ended = false;
    safe = 5;
    grassCount = 0;
    clearInput();

    $("lab").hidden = true;
    $("battle").hidden = true;

    saveLabel.textContent =
      "読み込み済み：" + saveTimeText(data.savedAt);

    return partner
      ? "おかえり！ " + partner.name +
        "と冒険の続きを始めよう。進んだらセーブを忘れずに！"
      : "おかえり！ 保存した場所から再開したよ。研究所で相棒を選ぼう！";
  } catch (error) {
    saveLabel.textContent = "保存データを読み込めませんでした";

    return "保存データの形式や内容を確認できなかったため、最初から始めます。" +
      "元の保存データは残していますが、セーブを押すと上書きされます。";
  }
}

const baseStatus = status;
status = function() {
  baseStatus();
  $("status").textContent +=
    " ｜ " + areaNames[area] +
    " ｜ " + money + "円 ｜ 回復薬 " + potions + "個";
};

const baseHeal = heal;
heal = function() {
  const previousBalls = balls;
  baseHeal();
  balls = Math.max(previousBalls, 5);
  status();
};

/* 村の元マップを保持し、別エリアだけ追加 */
const villageTile = tile;
tile = function(x, y) {
  if (x === 18 && y === 7) return "path";
  if (area > 0 && x === 1 && y === 7) return "path";

  if (area === 0) {
    if (x >= 2 && x <= 5 && y >= 8 && y <= 9) return "house";
    return villageTile(x, y);
  }

  if (x <= 0 || y <= 0 || x >= W-1 || y >= H-1) return "tree";
  if (y === 7 || x === 2 || x === 17) return "path";

  if (area === 1) {
    if ((x === 8 || x === 12) && y >= 3 && y <= 5) return "tree";
    if (x >= 4 && x <= 15 && y >= 2 && y <= 11) return "grass";
  }
  if (area === 2) {
    if (y >= 10 || (x >= 12 && y <= 4)) return "water";
    if (x >= 4 && x <= 15 && y >= 5 && y <= 9) return "grass";
  }
  if (area === 3) {
    if (y === 3 && x >= 5 && x <= 12) return "water";
    if (x >= 4 && x <= 14 && y >= 5 && y <= 11) return "grass";
  }
  return "ground";
};

blocked = function(x, y) {
  return ["tree","house","water"].includes(tile(x,y)) ||
    (area === 0 && ((x === 10 && y === 6) || (x === 7 && y === 5))) ||
    (area === 3 && x === 16 && y === 6);
};

const originalDraw = draw;
const originalDrawTile = drawTile;
drawTile = function(x, y) {
  originalDrawTile(x, y);
  const t = tile(x,y);
  if (area === 2 && t === "ground") {
    rect(x*T,y*T,T,T,(x+y)%2 ? "#dec999" : "#e6d5a9");
    rect(x*T+8,y*T+20,4,2,"#b7aa80");
  }
  if (area === 3 && t === "ground") {
    rect(x*T,y*T,T,T,(x+y)%2 ? "#a5a291" : "#b2ad97");
    rect(x*T+8,y*T+18,9,4,"#8c9084");
  }
  if (area === 3 && t === "water") {
    rect(x*T,y*T,T,T,"#606f72");
    rect(x*T+3,y*T+9,26,5,"#b8bcb0");
    rect(x*T+3,y*T+22,26,3,"#7f8b89");
  }
};

function mapLabel(text, x, y) {
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#183734";
  ctx.fillRect(x-56, y-15, 112, 22);
  ctx.fillStyle = "#fff0bf";
  ctx.fillText(text,x,y);
}

draw = function() {
  if (area === 0) {
    originalDraw();
    rect(65,260,128,56,"#e6c895");
    rect(61,252,136,17,"#668f91");
    rect(128,280,30,36,"#725b48");
    mapLabel("SHOP",128,279);
    mapLabel("調べる ↑",144,339);
  } else {
    for(let y=0;y<H;y++) for(let x=0;x<W;x++) drawTile(x,y);
    if (area === 1) {
      for(let i=0;i<12;i++) {
        const x=90+(i*43)%460;
        const y=65+(i*37)%270;
        rect(x,y+Math.sin(clock*2+i)*6,3,3,"#f3ee9b");
      }
    }
    if (area === 3) {
      person(16*T,6*T,false,"down",false);
      rect(16*T+5,6*T+16,24,12,"#6d9298");
      mapLabel(bossDefeated ? "鈴木太間 ★" : "鈴木太間",16*T+16,6*T-6);
    }
    person(p.px,p.py,true,p.dir,p.moving);
  }

  if (area > 0) mapLabel("← 前のエリア",65,240);
  if (area < 3) mapLabel("次のエリア →",565,240);
  else mapLabel("工事峠・最奥",560,240);
};

function travel(next) {
  if (!partner) {
    say("先に研究所で相棒を選ぼう！");
    return;
  }
  const forward = next > area;
  area = next;
  p.x = forward ? 2 : 17;
  p.y = 7;
  p.px = p.x*T;
  p.py = p.y*T;
  p.moving = false;
  safe = 5;
  grassCount = 0;
  clearInput();
  canvas.setAttribute("aria-label",areaNames[area] + "のマップ");
  status();
  say(areaNames[area] + "に到着！ 左右の看板の近くで「調べる」と移動できます。");
}

const baseInteract = interact;
interact = function() {
  if (mode !== "map" || p.moving) return;

  if (p.y === 7 && p.x >= 17 && area < 3) {
    travel(area+1); return;
  }
  if (p.y === 7 && p.x <= 2 && area > 0) {
    travel(area-1); return;
  }
  if (area === 0) {
    if (p.x === 4 && p.y === 10) {
      openShop(); return;
    }
    baseInteract(); return;
  }
  if (area === 3 && Math.abs(p.x-16)+Math.abs(p.y-6) === 1) {
    if (bossDefeated) {
      say("鈴木太間：いい腕だ。穂谷野も、お前のことを認めているぞ！");
    } else {
      startBoss();
    }
    return;
  }
  say(area === 3
    ? "鈴木太間は右上。草むらには激レアの穂谷野が出現することも！"
    : "草むらを歩くとモンスターと遭遇します。左右の道から次のエリアへ！");
};
$("action").onclick = interact;

function createMonster(name, level) {
  const s = speciesList.find(m => m.name === name);
  const growth = Math.max(0,level-5);
  const maxHp = s.maxHp + level + growth*2;
  return {
    ...s, level, maxHp, hp:maxHp, exp:0,
    atk:s.atk + growth*2,
    def:s.def + growth
  };
}

function startEncounter(mon, isBoss) {
  enemy = mon;
  bossBattle = isBoss;
  rewardGiven = false;
  guarding = false;
  movePower = 1;
  mode = "battle";
  busy = false;
  ended = false;
  grassCount = 0;
  clearInput();
  closeMovePanel();
  $("battleTitle").textContent = isBoss
    ? "親方・鈴木太間が勝負をしかけてきた！"
    : "野生の" + enemy.name + "が現れた！";
  $("enemySprite").textContent = enemy.icon;
  $("enemySprite").dataset.monster = enemy.name;
  log(isBoss
    ? "鈴木太間：頼むぞ、穂谷野！\n穂谷野 Lv.20 が立ちはだかる！"
    : "いっておいで、" + partner.name + "！");
  syncBattle();
  $("battle").hidden = false;
  $("attack").focus();
}

encounter = function() {
  const pools = [
    ["モコリ","ハネピ","クサモチ"],
    ["モコリ","クサモチ","ホタルン","ヨルフク","コゲタヌ"],
    ["ハネピ","ミズマル","アワネコ","ツララビ"],
    ["イシコロガ","ハガネムシ","コゲタヌ","ヨルフク"]
  ];
  const levels = [[2,4],[5,8],[8,12],[12,16]];
  const pool = pools[area];
  const name = area === 3 && Math.random() < .015
    ? "穂谷野"
    : pool[Math.floor(Math.random()*pool.length)];
  const [min,max] = levels[area];
  const level = min + Math.floor(Math.random()*(max-min+1));
  startEncounter(createMonster(name,level),false);
};

function startBoss() {
  if (!partner) return;
  startEncounter(createMonster("穂谷野",20),true);
}

const baseSyncBattle = syncBattle;
syncBattle = function() {
  baseSyncBattle();
  battleParty.disabled = busy || ended;
  $("catch").disabled = busy || ended || bossBattle || balls <= 0 || party.length >= 6;
  $("run").disabled = busy || ended || bossBattle;
  if (bossBattle && !ended) {
    $("battleNote").textContent =
      "トレーナー戦：捕獲・逃走はできません。仲間の交代や回復薬を活用しよう！";
  }
};

const baseFinish = finish;
finish = function(text) {
  if (enemy && enemy.hp === 0 && !rewardGiven) {
    rewardGiven = true;
    const reward = bossBattle ? 1500 : enemy.level*25;
    money += reward;
    text += "\n賞金 " + reward + "円を獲得！";
    if (bossBattle) {
      bossDefeated = true;
      text += "\n鈴木太間：見事だ！ お前たちは一人前だ！";
    }
  }
  baseFinish(text);
};

const baseCloseBattle = $("closeBattle").onclick;
$("closeBattle").onclick = function(event) {
  if (!ended || !caught.overlay.hidden) return;
  if (partner.hp <= 0) area = 0;
  baseCloseBattle.call(this,event);
  bossBattle = false;
  status();
  canvas.setAttribute("aria-label",areaNames[area] + "のマップ");
};

/* 手持ちの閲覧・交代・回復 */
let rosterInBattle = false;

function closeParty() {
  roster.overlay.hidden = true;
  if (!rosterInBattle) mode = "map";
  clearInput();
  if (rosterInBattle) battleParty.focus();
  else canvas.focus({preventScroll:true});
}

function openParty(inBattle) {
  if (inBattle) {
    if (mode !== "battle" || busy || ended) return;
    closeMovePanel();
  } else if (mode !== "map" || p.moving) {
    return;
  }
  rosterInBattle = inBattle;
  clearInput();
  if (!inBattle) mode = "party";
  renderParty();
  roster.overlay.hidden = false;
  roster.card.querySelector("button").focus();
}

function renderParty() {
  roster.card.replaceChildren();
  const title = document.createElement("h2");
  title.textContent = "手持ちモンスター " + party.length + "/6";
  roster.card.appendChild(title);

  if (!party.length) {
    const p = document.createElement("p");
    p.textContent = "まだ仲間がいません。研究所で相棒を選ぼう！";
    roster.card.appendChild(p);
  }

  party.forEach(mon => {
    const entry = document.createElement("div");
    entry.className = "party-entry";
    entry.innerHTML = `
      <div class="party-top">
        ${portrait(mon.name)}
        <div>
          <strong>${mon === partner ? "★ " : ""}${mon.name} Lv.${mon.level}</strong>
          <p>HP ${mon.hp}/${mon.maxHp}</p>
          <p>攻撃 ${mon.atk} ／ 防御 ${mon.def}</p>
          <p>EXP ${mon.exp}/${mon.level*8}</p>
        </div>
      </div>
      <p>技：たいあたり ／ ${moveNames[mon.name] || "全力アタック"}
      ／ ひと休み ／ 身を守る</p>
    `;
    const buttons = document.createElement("div");
    buttons.className = "party-buttons";

    const swap = addButton(buttons,
      mon === partner ? "現在の先頭" : "先頭にする", () => {
        if (mon === partner || mon.hp <= 0) return;
        partner = mon;
        status();
        if (rosterInBattle) {
          closeParty();
          guarding = false;
          busy = true;
          log("いっておいで、" + mon.name + "！");
          syncBattle();
          enemyTurn();
        } else {
          renderParty();
        }
      });
    swap.disabled = mon === partner || mon.hp <= 0;

    const use = addButton(buttons, "回復薬（残り" + potions + "）", () => {
      if (potions <= 0 || mon.hp <= 0 || mon.hp >= mon.maxHp) return;
      potions--;
      const amount = Math.min(30,mon.maxHp-mon.hp);
      mon.hp += amount;
      status();
      if (rosterInBattle) {
        closeParty();
        busy = true;
        log(mon.name + "に回復薬！ HPが" + amount + "回復した。");
        syncBattle();
        enemyTurn();
      } else {
        renderParty();
      }
    });
    use.disabled = potions <= 0 || mon.hp <= 0 || mon.hp >= mon.maxHp;
    entry.appendChild(buttons);
    roster.card.appendChild(entry);
  });

  const note = document.createElement("p");
  note.textContent = rosterInBattle
    ? "交代・回復薬は1ターン消費します。回復薬はHPを30回復します。"
    : "★が先頭の仲間です。ひんしの仲間は研究所で回復できます。";
  roster.card.appendChild(note);
  addButton(roster.card,"閉じる",closeParty);
}

  renderShop();

function renderShop() {
  shop.card.innerHTML = `
    <h2>コモレビ商店</h2>
    <p>所持金：${money}円</p>
    <p>捕獲ボール：${balls}個 ／ 回復薬：${potions}個</p>
    <p>回復薬はHPを30回復。戦闘中にも使えます。</p>
  `;
  const choices = document.createElement("div");
  choices.className = "choices";

  const ball = addButton(choices,"捕獲ボールを買う · 100円",() => {
    if (money < 100 || balls >= 999) return;
    money -= 100; balls++;
    status(); renderShop();
  });
  ball.disabled = money < 100 || balls >= 999;

  const medicine = addButton(choices,"回復薬を買う · 150円",() => {
    if (money < 150 || potions >= 999) return;
    money -= 150; potions++;
    status(); renderShop();
  });
  medicine.disabled = money < 150 || potions >= 999;

  addButton(choices,"お店を出る",() => {
    shop.overlay.hidden = true;
    mode = "map";
    clearInput();
    say("店員：ありがとう！ また来てね！");
    canvas.focus({preventScroll:true});
  });
  shop.card.appendChild(choices);
}

/* 捕獲：成功が必ずわかる確認画面 */
$("catch").onclick = function() {
  if (mode !== "battle" || busy || ended || bossBattle ||
      balls <= 0 || party.length >= 6) return;

  closeMovePanel();
  guarding = false;
  busy = true;
  balls--;
  log("ボールを投げた……！");
  syncBattle();

  setTimeout(() => {
    if (Math.random() < chance()) {
      const mon = {...enemy,hp:enemy.maxHp};
      party.push(mon);
      finish(enemy.name + "を捕まえた！\n" +
        "手持ちに加わった！ 仲間 " + party.length + "/6");

      setTimeout(() => {
        caught.card.innerHTML = `
          <h2>✨ 捕獲成功！</h2>
          ${portrait(mon.name)}
          <p class="capture-success">${mon.name} Lv.${mon.level}</p>
          <p>新しい仲間が手持ちに加わりました！</p>
          <p>HP ${mon.maxHp} ／ 攻撃 ${mon.atk} ／ 防御 ${mon.def}</p>
          <p>手持ち：${party.length}/6匹</p>
        `;
        const ok = addButton(caught.card,"確認して冒険を続ける",() => {
          caught.overlay.hidden = true;
          $("closeBattle").click();
        });
        caught.overlay.hidden = false;
        ok.focus();
      },600);
    } else {
      append("ボールから出てしまった！");
      enemyTurn();
    }
  },1100);
};

/* ===== 拡張セーブ：旧データも読める ===== */
const oldValidateSave = validateSave;
validateSave = function(data) {
  if (!data || (data.version !== 1 && data.version !== 2)) {
    throw new Error("保存形式が違います");
  }

  const isNew = data.version === 2;
  const nextArea = isNew ? data.area : 0;
  const nextMoney = isNew ? data.money : 300;
  const nextPotions = isNew ? data.potions : 3;

  if (!validInteger(nextArea,0,3) ||
      !validInteger(nextMoney,0,Number.MAX_SAFE_INTEGER) ||
      !validInteger(nextPotions,0,999) ||
      !validInteger(data.balls,0,999) ||
      (isNew && typeof data.bossDefeated !== "boolean")) {
    throw new Error("追加データが不正です");
  }

  const point = data.player;
  if (!point || !validInteger(point.x,1,W-2) ||
      !validInteger(point.y,1,H-2) ||
      !Object.prototype.hasOwnProperty.call(directions,point.dir)) {
    throw new Error("位置が不正です");
  }

  /* 元の厳密な仲間検証を利用。位置だけ安全な村座標で検証 */
  const previousArea = area;
  let restored;
  try {
    area = 0;
    restored = oldValidateSave({
      ...data,
      version:1,
      balls:Math.min(data.balls,5),
      player:{x:7,y:10,dir:point.dir}
    });
    area = nextArea;
    if (blocked(point.x,point.y)) {
      throw new Error("移動できない場所です");
    }
  } finally {
    area = previousArea;
  }

  if (nextArea > 0 && !restored.length) {
    throw new Error("相棒がいません");
  }

  /* すべて確認した後で追加項目を反映 */
  area = nextArea;
  money = nextMoney;
  potions = nextPotions;
  bossDefeated = isNew ? data.bossDefeated : false;
  return restored;
};

saveButton.removeEventListener("click",saveAdventure);
saveButton.addEventListener("click",() => {
  clearInput();
  if (mode !== "map" || p.moving) {
    say("探索中、立ち止まってからセーブしてね。");
    return;
  }

  const data = {
    version:2,
    savedAt:Date.now(),
    player:{x:p.x,y:p.y,dir:p.dir},
    party:party.map(m => ({...m})),
    partnerIndex:partner ? party.indexOf(partner) : -1,
    balls, area, money, potions, bossDefeated
  };

  try {
    const previous = localStorage.getItem(SAVE_KEY);
    if (previous) {
      /* 上書き前に直前データを必ず退避 */
      localStorage.setItem(SAVE_KEY+"-previous",previous);

      let parsed = null;
      try { parsed = JSON.parse(previous); } catch (_) {}
      if (parsed && parsed.version === 1 &&
          localStorage.getItem(SAVE_KEY+"-v1-backup") === null) {
        localStorage.setItem(SAVE_KEY+"-v1-backup",previous);
      }
    }
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    saveLabel.textContent = "保存済み：" + saveTimeText(data.savedAt);
    say("セーブ完了！ 現在地・仲間・所持品・所持金・ボス撃破状況を保存しました。");
  } catch (_) {
    saveLabel.textContent = "保存できませんでした";
    say("保存領域を確認してね。冒険はそのまま続けられます。");
  }
  canvas.focus({preventScroll:true});
});

/* 手持ち画面に「逃がす」を追加 */
const renderPartyBeforeRelease = renderParty;

renderParty = function() {
  renderPartyBeforeRelease();

  // 元の描画で消える見出しIDも付け直す
  const heading = roster.card.querySelector("h2");
  if (heading) heading.id = "partyPanelTitle";

  const entries = roster.card.querySelectorAll(".party-entry");

  entries.forEach((entry, index) => {
    const mon = party[index];
    const buttons = entry.querySelector(".party-buttons");

    if (!mon || !buttons) return;

    const release = addButton(buttons, "逃がす", () => {
      if (rosterInBattle || mode !== "party") return;

      if (party.length <= 1) {
        window.alert("最後の1匹は逃がせません。");
        return;
      }

      // 先頭を逃がす場合、生きている交代先が必要
      const replacement = party.find(
        other => other !== mon && other.hp > 0
      );

      if (mon === partner && !replacement) {
        window.alert(
          "交代できる元気な仲間がいません。" +
          "先に研究所で回復してね。"
        );
        return;
      }

      const confirmed = window.confirm(
        mon.name + " Lv." + mon.level + "を逃がしますか？\n" +
        "逃がした仲間は手持ちからいなくなります。"
      );

      if (!confirmed) return;

      const currentIndex = party.indexOf(mon);
      if (currentIndex < 0) return;

      party.splice(currentIndex, 1);

      if (partner === mon) {
        partner = replacement;
      }

      status();
      renderParty();

      say(
        mon.name + "を自然に帰した。またどこかで会えるといいね。" +
        "変更を残すにはセーブしてね。"
      );

      const firstButton = roster.card.querySelector(
        "button:not(:disabled)"
      );

 */
enemyTurn = function() {
  setTimeout(() => {
    if (mode !== "battle" || ended || !enemy || !partner) return;

    const amount = Math.min(
      partner.hp,
      damage(enemy, partner)
    );

    partner.hp -= amount;

    append(
      enemy.name + "の攻撃！ " + amount + "ダメージ。"

      const fallenName = partner.name;

      append(fallenName + "は力尽きた……。");

      if (!nextPartner) {

      guarding = false;
      movePower = 1;

      append(
        "まだ仲間がいる！\n" +
        "いっておいで、" + partner.name + "！"

    syncBattle();
    $("attack").focus({ preventScroll: true });

};

const validateBeforeChapter2 = validateSave;

validateSave = function(data) {
  const restoredEvents = {
    metSuzuki: false,
    boughtCutter: false,
    cableCut: false,
    defeatedByWorker: false,
    fishingRod: false
  };

  if (data && data.chapter2 !== undefined) {
    if (
      !data.chapter2 ||
      typeof data.chapter2 !== "object" ||
      Array.isArray(data.chapter2)
    ) {
      throw new Error("第2章の保存内容が不正です");
    }

    for (const key of Object.keys(restoredEvents)) {
      const value = data.chapter2[key];

      if (value !== undefined && typeof value !== "boolean") {
        throw new Error("イベントの進行状態が不正です");
      }

      restoredEvents[key] = value === true;
    }
  }

  // 既存の仲間・所持金・マップの検証を先に行う
  const restoredParty = validateBeforeChapter2(data);

  chapter2State = restoredEvents;
  return restoredParty;
};

      localStorage.setItem(SAVE_KEY + "-previous", previous);

      // 第2章対応前のデータも一度だけ残す

/* ---------- マップ ---------- */

const tileBeforeStorage = tile;

tile = function(x, y) {
  if (area !== STORAGE_AREA) {
    return tileBeforeStorage(x, y);
  }

  if (x <= 0 || y <= 0 || x >= W - 1 || y >= H - 1) {
    return "tree";
  }

  // 横長の電気錠付きフェンス。
  // イベント完了後だけ中央の扉が通行可能になる。
  if (x === 12 && y >= 1 && y <= 12) {
    if (y === 7 && chapter2State.defeatedByWorker) {
      return "path";
    }
    return "house";
  }

  // ケーブルの制御盤と宝箱
  if ((x === 11 && y === 6) || (x === 5 && y === 10)) {
    return "house";
  }

  if (x >= 3 && x <= 8 && y >= 2 && y <= 3) {
    return "house";
  }

  if (x >= 15 && x <= 17 && y >= 10 && y <= 11) {
    return "water";
  }

  if (y === 7 || x === 2 || x === 17) return "path";

  return "ground";
};

const drawBeforeStorage = draw;

draw = function() {
  if (area !== STORAGE_AREA) {
    drawBeforeStorage();

    if (area === 3 && chapter2State.metSuzuki) {
      mapLabel("資材保管区画 →", 560, 240);
    }
    return;
  }

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      drawTile(x, y);

      if (tile(x, y) === "ground") {
        rect(x*T, y*T, T, T, (x+y)%2 ? "#a9aa96" : "#b7b5a0");
        rect(x*T+6, y*T+22, 9, 3, "#8f9585");
      }
    }
  }

  // 積まれた資材
  for (let x = 3; x <= 8; x++) {
    for (let y = 2; y <= 3; y++) {
      rect(x*T+2, y*T+3, 28, 27, "#947755");
      rect(x*T+5, y*T+7, 22, 3, "#ceb58a");
      rect(x*T+13, y*T+3, 4, 27, "#5d655b");
    }
  }

  // フェンスと電気錠の扉
  for (let y = 1; y <= 12; y++) {
    if (y === 7 && chapter2State.defeatedByWorker) continue;

    rect(12*T+5, y*T, 22, T, "#596f70");
    rect(12*T+8, y*T+4, 4, 24, "#a8bbb2");
    rect(12*T+20, y*T+4, 4, 24, "#a8bbb2");
  }

  if (!chapter2State.defeatedByWorker) {
    rect(12*T+3, 7*T+2, 26, 28, "#465b60");
    rect(12*T+14, 7*T+12, 6, 7, "#e7bd68");
  }

  // ケーブルと制御盤
  rect(11*T+4, 6*T+5, 24, 25, "#52676a");
  rect(
    11*T+10, 6*T+10, 8, 6,
    chapter2State.cableCut ? "#73877a" : "#efb959"
  );

  if (!chapter2State.cableCut) {
    rect(11*T+24, 6*T+12, 19, 4, "#d99d54");
  }

  // 後続の釣りシステムで使用する宝箱
  rect(5*T+3, 10*T+9, 26, 21, "#a47748");
  rect(5*T+3, 10*T+9, 26, 5, "#dfbb70");
  rect(5*T+14, 10*T+15, 5, 7, "#f1d791");

  person(p.px, p.py, true, p.dir, p.moving);

  mapLabel("← 工事峠", 65, 240);
  mapLabel("制御盤", 11*T+16, 6*T-5);
  mapLabel("宝箱", 5*T+16, 10*T-3);

  if (chapter2State.defeatedByWorker) {
    mapLabel("扉の先へ →", 560, 240);
  }
};

      } else if (!chapter2State.boughtCutter) {
        say("丈夫なケーブルだ。村の商店でボルトカッターを買ってこよう。");
      } else if (window.confirm("ケーブルを切断して、イベントを進めますか？")) {
        beginCableEvent();
      }
      return;
    }

    if (Math.abs(p.x-5) + Math.abs(p.y-10) === 1) {
      say("宝箱がある。中身の取得は、次の釣りシステム追加で有効になります。");
      return;
    }

    if (p.y === 7 && p.x >= 17 &&
        chapter2State.defeatedByWorker) {
      say("扉の先には新たな道が続いている。新マップ3種は次の追加で実装します。");
      return;
    }

    say(chapter2State.defeatedByWorker
      ? "作業員の姿はもうない。中央の扉を通って向こう側へ進める。"
      : "中央の制御盤にケーブルがつながっている。近づいて調べよう。");
    return;
  }

  interactBeforeStorage();
};

$("action").onclick = interact;

/* ---------- 新エリアのセーブ検証 ---------- */
/*
 * 保存ボタンは既存のものを使用。
 * 既存の検証はエリア0～3限定なので、
 * エリア4だけ位置と進行条件を追加検証する。
 */
const validateBeforeStorage = validateSave;

validateSave = function(data) {
  if (!data || data.version !== 2 || data.area !== STORAGE_AREA) {
    return validateBeforeStorage(data);
  }

  const point = data.player;

  if (!point ||
      !validInteger(point.x, 1, W-2) ||
      !validInteger(point.y, 1, H-2) ||
      !Object.prototype.hasOwnProperty.call(directions, point.dir)) {
    throw new Error("資材保管区画の位置が不正です");
  }

  const previous = {
    area,
    money,
    potions,
    bossDefeated,
    chapter2State
  };

  try {
    // 仲間・所持品・イベントフラグは既存の検証を再利用。
    const restored = validateBeforeStorage({
      ...data,
      area: 0,
      player: {x:7, y:10, dir:point.dir}
    });

    if (!restored.length ||
        !bossDefeated ||
        !chapter2State.metSuzuki) {
      throw new Error("資材保管区画への進行条件が不正です");
    }

    if (chapter2State.defeatedByWorker &&
        (!chapter2State.cableCut || !chapter2State.boughtCutter)) {
      throw new Error("イベントの進行状態が不正です");
    }

    // 演出中・戦闘中は保存できないため、
    // 切断済みでイベント未完了の保存は受け付けない。
    if (chapter2State.cableCut &&
        !chapter2State.defeatedByWorker) {
      throw new Error("イベントが未完了です");
    }

    area = STORAGE_AREA;

    if (blocked(point.x, point.y) ||
        (point.x > 12 && !chapter2State.defeatedByWorker)) {
      throw new Error("移動できない場所です");
    }

    return restored;
  } catch (error) {
    area = previous.area;
    money = previous.money;
    potions = previous.potions;
    bossDefeated = previous.bossDefeated;
    chapter2State = previous.chapter2State;
    throw error;
  }
};

/* ===== 資材保管区画・作業員イベントここまで ===== */
/* ===== 釣りシステム・海パン穂谷野 ===== */

/* 独立した種族として登録。旧セーブの仲間検証にも対応 */
const swimmingHotayano = {
  name: "海パン穂谷野",
  icon: "🩳",
  maxHp: 62,
  atk: 23,
  def: 16
};

wildTypes.push(swimmingHotayano);
speciesList.push(swimmingHotayano);

moveNames["海パン穂谷野"] = "豪快クロール";

/* ---------- 専用イラスト ---------- */

const artBeforeFishing = window.komorebiExtraArt;

window.komorebiExtraArt = function(name) {
  if (name !== "海パン穂谷野") {
    return artBeforeFishing ? artBeforeFishing(name) : "";
  }

  return `
    <svg class="mon-art" viewBox="0 0 128 128"
      role="img" aria-label="海パン穂谷野">
      <ellipse cx="64" cy="119" rx="46" ry="7"
        fill="#649eae" opacity=".35"/>

      <g stroke="#354d43" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round">
        <path d="M39 57L23 70L13 91L24 97L43 76
          M89 57L105 70L115 91L104 97L85 76"
          fill="#edbf94"/>

        <path d="M41 51Q64 44 87 51L92 88
          Q64 99 36 88Z"
          fill="#f0c69f"/>

        <path d="M38 87L90 87L88 108L68 108L64 98
          L60 108L40 108Z"
          fill="#397fad"/>

        <path d="M40 87H88" stroke="#f1d98b"/>
        <path d="M46 93L51 100M78 93L73 100"
          stroke="#e9edca"/>

        <path d="M43 109L42 117L58 117L57 109
          M71 109L70 117L86 117L85 109"
          fill="#edbf94"/>

        <ellipse cx="64" cy="32" rx="22" ry="25"
          fill="#f0c69f"/>

        <path d="M42 25Q44 5 64 6Q84 5 86 25
          L76 19L53 19Z"
          fill="#414c49"/>

        <path d="M42 29H86" stroke="#446d81"/>

        <rect x="46" y="25" width="15" height="11"
          rx="4" fill="#91d9e3"/>
        <rect x="67" y="25" width="15" height="11"
          rx="4" fill="#91d9e3"/>
        <path d="M61 29H67"/>

        <path d="M56 44Q64 50 72 44" fill="none"/>
        <path d="M51 64L59 68M77 64L69 68
          M64 70V79" fill="none" stroke="#bc8c70"/>

        <path d="M8 113Q19 105 30 113T52 113
          M77 118Q88 110 99 118T121 118"
          fill="none" stroke="#91d7df"/>
      </g>
    </svg>
  `;
};

/* ---------- 釣り竿の宝箱 ---------- */

const interactBeforeFishingSystem = interact;

interact = function() {
  if (mode !== "map" || p.moving) return;

  const besideChest =
    area === STORAGE_AREA &&
    Math.abs(p.x - 5) + Math.abs(p.y - 10) === 1;

  if (besideChest) {
    if (chapter2State.fishingRod) {
      say("開いた宝箱だ。釣り竿は「大事な道具」に入っている。");
      return;
    }

    chapter2State.fishingRod = true;
    clearInput();

    say(
      "宝箱から「釣り竿」を手に入れた！\n" +
      "水辺に向かって「🎣 釣りをする」を押そう。" +
      "手持ちが6匹だと捕獲できないので注意！ セーブも忘れずに。"
    );
    return;
  }

  interactBeforeFishingSystem();
};

$("action").onclick = interact;

/* 宝箱を取得済みの見た目にする */
const drawBeforeFishingSystem = draw;

draw = function() {
  drawBeforeFishingSystem();

  if (area === STORAGE_AREA && chapter2State.fishingRod) {
    rect(5*T+3, 10*T+9, 26, 6, "#684d37");
    rect(5*T+6, 10*T+16, 20, 8, "#443c31");
    rect(5*T+3, 10*T+25, 26, 5, "#a47748");
  }
};

/* ---------- 釣り ---------- */

const fishingButton = addButton(
  toolbar,
  "🎣 釣りをする",
  startFishing
);

function startFishing() {
  if (mode !== "map" || p.moving) return;

  if (!chapter2State.fishingRod) {
    say("釣り竿が必要です。資材保管区画の宝箱を探そう！");
    return;
  }

  if (!partner || partner.hp <= 0) {
    say("釣りには元気な相棒が必要です。");
    return;
  }

  const [dx, dy] = directions[p.dir];
  const targetX = p.x + dx;
  const targetY = p.y + dy;

  // 工事峠の「water」は水ではなく設備のため除外
  if (area === 3 || tile(targetX, targetY) !== "water") {
    say("水辺のすぐ隣で、水の方を向いて押してね。村の池やしぶき海岸で釣りができます。");
    return;
  }

  const fishingArea = area;
  const fishingX = p.x;
  const fishingY = p.y;

  clearInput();
  mode = "fishing";
  fishingButton.disabled = true;

  say("釣り糸を垂らした……。何が釣れるかな？");

  setTimeout(() => {
    // 待機中に状態が変わった場合は戦闘を開始しない
    if (
      mode !== "fishing" ||
      area !== fishingArea ||
      p.x !== fishingX ||
      p.y !== fishingY
    ) {
      fishingButton.disabled = false;

      if (mode === "fishing") {
        mode = "map";
        clearInput();
      }
      return;
    }

    // レア判定は1回の釣りにつき1回のみ
    const rare = Math.random() < 0.012;
    const name = rare
      ? "海パン穂谷野"
      : Math.random() < 0.5 ? "アワネコ" : "ミズマル";

    const level = rare
      ? 25
      : 8 + Math.floor(Math.random() * 5);

    fishingButton.disabled = false;

    startEncounter(createMonster(name, level), false);

    $("battleTitle").textContent = rare
      ? "激レア！ 海パン穂谷野が釣れた！"
      : "釣れたのは、野生の" + name + "！";

    say(rare
      ? "大きな水しぶき！ 海パン穂谷野が現れた！"
      : name + "が釣れた！");

    log(
      (rare
        ? "水面から海パン穂谷野が飛び出した！"
        : "釣り糸に" + name + "が食いついた！") +
      "\nいっておいで、" + partner.name + "！"
    );
  }, 1800);
}

/* ---------- 海パン穂谷野の専用技 ---------- */
/*
 * 専用技は通常の攻撃処理を利用するので、
 * 経験値・レベルアップ・作業員戦の分岐を維持。
 * 倍率は通常攻撃に対する値。
 */

const swimmingMoves = [
  {name:"豪快クロール", power:1.55, accuracy:0.95},
  {name:"海パンプレス", power:1.90, accuracy:0.80},
  {name:"大波フィニッシュ", power:2.40, accuracy:0.65}
];

const swimmingMoveButtons = swimmingMoves.map(move => {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent =
    move.name + " · " + move.power + "倍 / " +
    Math.round(move.accuracy * 100) + "%";

  button.hidden = true;
  button.onclick = () => useSwimmingMove(move);

  movePanel.insertBefore(button, cancelMove);
  return button;
});

function useSwimmingMove(move) {
  if (
    mode !== "battle" ||
    busy ||
    ended ||
    !partner ||
    partner.name !== "海パン穂谷野"
  ) return;

  closeMovePanel();
  guarding = false;
  movePower = 1;

  if (Math.random() >= move.accuracy) {
    busy = true;
    log(partner.name + "の" + move.name + "！\n攻撃は外れた！");
    syncBattle();
    enemyTurn();
    return;
  }

  movePower = move.power;

  try {
    originalAttack();

    $("log").textContent = $("log").textContent.replace(
      partner.name + "の攻撃！",
      partner.name + "の" + move.name + "！"
    );
  } finally {
    movePower = 1;
  }
}

/*
 * 海パン穂谷野では既存の「属性技」を隠し、
 * 専用技3つを表示。たいあたり・休憩・防御は維持。
 */
const refreshBeforeSwimmingMoves = refreshMovePanel;

refreshMovePanel = function() {
  refreshBeforeSwimmingMoves();

  const swimming =
    !!partner && partner.name === "海パン穂谷野";

  moveButtons.special.hidden = swimming;

  swimmingMoveButtons.forEach(button => {
    button.hidden = !swimming;
    button.disabled =
      !swimming || mode !== "battle" || busy || ended;
  });

  if (swimming) {
    moveHelp.textContent =
      "専用技はボタンに威力倍率と命中率を表示。" +
      "ひと休みは最大HPの30%回復。" +
      "身を守ると次の攻撃のダメージを約65%軽減。";
  } else {
    moveHelp.textContent =
      "属性技は威力1.35倍・命中85%。" +
      "ひと休みは最大HPの30%回復。" +
      "身を守ると次の攻撃のダメージを約65%軽減。";
  }
};

/*
 * 既存の監視には以前の関数が登録されているため、
 * 専用技ボタン用にも更新監視を追加。
 */
new MutationObserver(() => {
  refreshMovePanel();
}).observe($("attack"), {
  attributes: true,
  attributeFilter: ["disabled"]
});

/* 手持ち画面でも専用技を案内 */
const renderPartyBeforeSwimming = renderParty;

renderParty = function() {
  renderPartyBeforeSwimming();

  roster.card.querySelectorAll(".party-entry").forEach((entry, index) => {
    if (party[index]?.name !== "海パン穂谷野") return;

    const moveText = Array.from(entry.children).find(
      element =>
        element.tagName === "P" &&
        element.textContent.startsWith("技：")
    );

    if (moveText) {
      moveText.textContent =
        "技：たいあたり ／ 豪快クロール ／ 海パンプレス ／ " +
        "大波フィニッシュ ／ ひと休み ／ 身を守る";
    }
  });
};

/* ---------- 敵としても専用技を使用 ---------- */

const enemyTurnBeforeSwimming = enemyTurn;

enemyTurn = function() {
  if (
    !enemy ||
    enemy.name !== "海パン穂谷野" ||
    workerEventBattle
  ) {
    enemyTurnBeforeSwimming();
    return;
  }

  const attackingEnemy = enemy;

  setTimeout(() => {
    if (
      mode !== "battle" ||
      ended ||
      enemy !== attackingEnemy ||
      !partner
    ) return;

    const move =
      swimmingMoves[Math.floor(Math.random() * swimmingMoves.length)];

    if (Math.random() >= move.accuracy) {
      // 防御はこの敵ターンで消費する
      guarding = false;
      append(enemy.name + "の" + move.name + "！ 攻撃は外れた！");
    } else {
      const amount = Math.min(
        partner.hp,
        Math.max(1, Math.floor(damage(enemy, partner) * move.power))
      );

      partner.hp -= amount;

      append(
        enemy.name + "の" + move.name + "！ " +
        amount + "ダメージ。"
      );
    }

    if (partner.hp <= 0) {
      append(partner.name + "は力尽きた……。");

      const next = party.find(mon => mon.hp > 0);

      if (!next) {
        finish("仲間が全員倒れてしまった……。");
        showGameOver();
        return;
      }

      partner = next;
      guarding = false;
      movePower = 1;
      append("いっておいで、" + partner.name + "！");
    }

    busy = false;
    syncBattle();
    $("attack").focus({ preventScroll: true });
  }, 550);
};

/* ===== 釣りシステムここまで ===== */

const welcomeMessage = restoreAdventure();
status();
say(welcomeMessage);
requestAnimationFrame(loop);
})();

</script>

const starterNames = ["コノハル","ヒノポン","ミズマル"];
const allNames = [
  "海パン穂谷野",
  ...starterNames,
  "モコリ","ハネピ","クサモチ",
  "イシコロガ","ホタルン","アワネコ","ヨルフク",
  "コゲタヌ","ツララビ","ハガネムシ","穂谷野"
];


document.querySelectorAll("[data-starter]").forEach(b=>{
  b.insertAdjacentHTML("afterbegin",art(starterNames[Number(b.dataset.starter)]));
});
const ally=document.createElement("div");
ally.id="allyArt";
$("allyInfo").before(ally);
function updateAlly(){
  const name=allNames.find(n=>$("allyInfo").textContent.includes(n));

  if(name&&ally.dataset.name!==name){
    ally.dataset.name=name;
    ally.innerHTML=art(name)+"<span>いっしょにがんばろう！</span>";

}

/* Web Audio：外部ファイル不要のオリジナルBGM */
const sound=document.createElement("button");
sound.id="soundToggle";
sound.textContent="♪ 音楽：OFF";
sound.setAttribute("aria-pressed","false");
$("status").before(sound);
let audio=null,enabled=false,timer=null,beat=0,nextTime=0;
const village=[72,76,79,76,74,77,81,77,76,79,84,79,74,77,79,71];
const combat=[69,76,81,76,72,79,84,79,71,78,83,78,68,75,80,75];
function tone(note,time,length,volume=.035,type="triangle"){
  if(!audio||!enabled)return;
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type=type;
  osc.frequency.value=440*Math.pow(2,(note-69)/12);
  gain.gain.setValueAtTime(0,time);
  gain.gain.linearRampToValueAtTime(volume,time+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,time+length);
  osc.connect(gain);gain.connect(audio.destination);
  osc.start(time);osc.stop(time+length+.03);
  osc.onended=()=>{osc.disconnect();gain.disconnect()};
}
function schedule(){
  if(!enabled||audio.state!=="running")return;
  if(nextTime<audio.currentTime)nextTime=audio.currentTime+.04;
  while(nextTime<audio.currentTime+.15){
    const fighting=!$("battle").hidden;
    const notes=fighting?combat:village;
    const interval=fighting?.19:.3;
    tone(notes[beat%16],nextTime,interval*.85,.025);
    if(beat%2===0){
      const bass=(fighting?[45,48,47,44]:[48,53,52,55])[Math.floor(beat/4)%4];
      tone(bass,nextTime,interval*1.7,.033);
    }
    if(beat%4===0)tone(notes[beat%16]-12,nextTime,interval*2,.013,"sine");
    beat++;nextTime+=interval;
  }
}
sound.onclick=async()=>{
  try{
    if(!audio){
      const AudioClass=window.AudioContext||window.webkitAudioContext;
      if(!AudioClass)throw new Error("unsupported");
      audio=new AudioClass();
    }
    if(enabled){
      enabled=false;clearInterval(timer);
      await audio.suspend();
    }else{
      await audio.resume();enabled=true;
      nextTime=audio.currentTime+.05;
      schedule();timer=setInterval(schedule,50);
    }
    sound.textContent=enabled?"♪ 音楽：ON":"♪ 音楽：OFF";
    sound.setAttribute("aria-pressed",String(enabled));
  }catch(e){
    enabled=false;clearInterval(timer);
    sound.textContent="音を再生できませんでした";
  }
};
document.addEventListener("visibilitychange",()=>{
  if(!audio||!enabled)return;
  if(document.hidden)audio.suspend();
  else audio.resume().catch(()=>{});
});
function effect(notes){
  if(!enabled||!audio||audio.state!=="running")return;
  notes.forEach((n,i)=>tone(n,audio.currentTime+i*.085,.15,.045,"sine"));
}

/* 戦闘の演出 */
const sprite=$("enemySprite"),card=$("battle").querySelector(".card");
function animate(el,name){
  el.classList.remove(name);
  void el.offsetWidth;
  el.classList.add(name);
}
function number(amount){
  const el=document.createElement("span");
  el.className="battle-number";el.textContent="−"+amount;
  sprite.appendChild(el);setTimeout(()=>el.remove(),850);
}
function sparks(){
  for(let i=0;i<12;i++){
    const el=document.createElement("span");
    el.className="spark";el.textContent=i%2?"✦":"✧";
    const angle=i*Math.PI/6;
    el.style.setProperty("--dx",Math.cos(angle)*105+"px");
    el.style.setProperty("--dy",Math.sin(angle)*65+"px");
    sprite.appendChild(el);setTimeout(()=>el.remove(),900);
  }
}
function hp(id){
  const m=$(id).textContent.match(/HP\s+(\d+)\s*\/\s*(\d+)/);
  return m?Number(m[1]):null;
}
let oldEnemy=null,oldAlly=null,lastLog="";
function startBattle(){
  if($("battle").hidden)return;

  const name =
    sprite.dataset.monster ||
    allNames.find(n=>$("battleTitle").textContent.includes(n));

  sprite.classList.remove("hit","captured","victory");
  if(name)sprite.innerHTML=art(name);

  oldEnemy=hp("enemyInfo");
  oldAlly=hp("allyInfo");
  lastLog=$("log").textContent;

  updateAlly();
  beat=0;
  effect([60,67,72,79]);

  let trainer=$("trainerPortrait");
  if(!trainer){
    trainer=document.createElement("div");
    trainer.id="trainerPortrait";
    $("battleTitle").after(trainer);
  }

  const isBoss=$("battleTitle").textContent.includes("鈴木太間");
  trainer.hidden=!isBoss;
    trainer.innerHTML=isBoss
    ? art("鈴木太間") +
      "<div><strong>親方・鈴木太間</strong> ／ 手持ち：穂谷野 Lv.20</div>"
    : "";
}

new MutationObserver(startBattle).observe($("battle"),{
  attributes:true,attributeFilter:["hidden"]
});

new MutationObserver(()=>{
  if($("battle").hidden)return;
  const current=hp("enemyInfo");
  if(oldEnemy!==null&&current!==null&&current<oldEnemy){
    animate(sprite,"hit");number(oldEnemy-current);
    effect([55,43]);
  }
  oldEnemy=current;
}).observe($("enemyInfo"),{childList:true,subtree:true,characterData:true});
new MutationObserver(()=>{
  if($("battle").hidden)return;
  const current=hp("allyInfo");
  if(oldAlly!==null&&current!==null&&current<oldAlly){
    animate(card,"shake");effect([48,40]);
  }
  oldAlly=current;
}).observe($("allyInfo"),{childList:true,subtree:true,characterData:true});
new MutationObserver(()=>{
  if($("battle").hidden)return;
  const text=$("log").textContent;
  if(text===lastLog)return;
  const before=lastLog;lastLog=text;
  if(text.includes("ボールを投げた")&&!before.includes("ボールを投げた")){
    sprite.querySelectorAll(".capture-ball").forEach(e=>e.remove());
    const ball=document.createElement("div");
    ball.className="capture-ball";sprite.appendChild(ball);
    effect([67,74,81]);
  }
  if(text.includes("ボールから出て")&&!before.includes("ボールから出て")){
    sprite.querySelectorAll(".capture-ball").forEach(e=>e.remove());
    animate(sprite,"hit");effect([65,60]);
  }
  if(text.includes("を捕まえた")&&!before.includes("を捕まえた")){
    sprite.classList.add("captured","victory");
    sparks();effect([72,76,79,84]);
  }
  if(text.includes("を倒した")&&!before.includes("を倒した")){
    sprite.classList.add("victory");sparks();effect([67,72,76,79]);
  }
  if(text.includes("レベルアップ")&&!before.includes("レベルアップ")){
    setTimeout(()=>effect([72,74,76,79,84]),420);
  }
}).observe($("log"),{childList:true,subtree:true,characterData:true});
})();
</script>

<script>
(function () {
  "use strict";

  const get = id => document.getElementById(id);
  const battle = get("battle");

  if (!battle || get("battleField")) return;

  const card = battle.querySelector(".card");
  const title = get("battleTitle");
  const enemyInfo = get("enemyInfo");
  const allyInfo = get("allyInfo");
  const enemyBar = get("enemyBar");
  const allyBar = get("allyBar");
  const enemySprite = get("enemySprite");
  const allyArt = get("allyArt");

  if (
    !card || !title || !enemyInfo || !allyInfo ||
    !enemyBar || !allyBar || !enemySprite || !allyArt
  ) return;

  /*
   * 要素を作り直さず移動するので、
   * 既存のHP更新・イラスト更新・演出監視を維持できます。
   */
  const field = document.createElement("div");
  field.id = "battleField";

  const enemyHud = document.createElement("div");
  enemyHud.className = "battle-hud enemy-hud";

  const allyHud = document.createElement("div");
  allyHud.className = "battle-hud ally-hud";

  const enemyHp = enemyBar.parentElement;
  const allyHp = allyBar.parentElement;

  title.after(field);
  enemyHud.append(enemyInfo, enemyHp);
  allyHud.append(allyInfo, allyHp);
  field.append(enemyHud, enemySprite, allyArt, allyHud);
  card.classList.add("battle-expanded");

  let curtain = null;
  let cleanupTimer = null;
  let transitioning = false;
  let wasHidden = battle.hidden;

  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  function finishTransition() {
    clearTimeout(cleanupTimer);

    if (curtain) {
      curtain.remove();
      curtain = null;
    }

    transitioning = false;
    battle.removeAttribute("inert");
    battle.classList.remove("battle-revealing");

    if (!battle.hidden && !get("attack").disabled) {
      get("attack").focus({ preventScroll: true });
    }
  }

  function beginTransition() {
    finishTransition();

    if (reduceMotion.matches) return;

    transitioning = true;
    battle.setAttribute("inert", "");
    battle.classList.add("battle-revealing");

    curtain = document.createElement("div");
    curtain.id = "encounterCurtain";
    curtain.setAttribute("aria-hidden", "true");
    document.body.appendChild(curtain);

    curtain.addEventListener("animationend", event => {
      if (event.animationName === "encounterCurtainAdded") {
        finishTransition();
      }
    });

    // アニメーションが完了しない場合も操作不能にしない
    cleanupTimer = setTimeout(finishTransition, 1100);
  }

  new MutationObserver(() => {
    const hidden = battle.hidden;

    if (wasHidden && !hidden) beginTransition();
    if (hidden) finishTransition();

    wasHidden = hidden;
  }).observe(battle, {
    attributes: true,
    attributeFilter: ["hidden"]
  });

  // 演出中の先行入力を防ぐ。戦闘ロジック自体は変更しない
  battle.addEventListener("click", event => {
    if (!transitioning) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  battle.addEventListener("keydown", event => {
    if (!transitioning) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);
})();
</script>

<script>
(function () {
  "use strict";

  function isGameControl(target) {
    return target instanceof Element &&
      target.closest(".controls, button, #game") !== null;
  }

  /* 長押しメニューを操作部分だけで抑える */
  document.addEventListener("contextmenu", function (event) {
    if (isGameControl(event.target)) {
      event.preventDefault();
    }
  }, true);

  /* 文字選択が始まるのを防ぐ */
  document.addEventListener("selectstart", function (event) {
    if (isGameControl(event.target)) {
      event.preventDefault();
    }
  }, true);

  /* ボタン内の画像などをドラッグさせない */
  document.addEventListener("dragstart", function (event) {
    if (isGameControl(event.target)) {
      event.preventDefault();
    }
  }, true);
})();
